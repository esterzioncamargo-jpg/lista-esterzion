<!DOCTYPE html>
<html lang="pt-BR">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --primary: #9b72aa;
      --primary-dark: #7a5488;
      --primary-light: #f3ebf6;
      --accent: #d4a373;
      --bg: #faf7fc;
      --surface: #ffffff;
      --text: #333333;
      --text-muted: #666666;
      --border: #eeddf2;
      --shadow: 0 4px 20px rgba(155, 114, 170, 0.08);
      --shadow-hover: 0 8px 30px rgba(155, 114, 170, 0.18);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    /* Hero Banner / Capa */
    .hero-banner {
      position: relative;
      width: 100%;
      height: 320px;
      background: linear-gradient(135deg, rgba(122, 84, 136, 0.85), rgba(155, 114, 170, 0.75)), 
                  url('https://images.unsplash.com/photo-1513151233558-d860c5398176?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-align: center;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .hero-banner::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 40px;
      background: linear-gradient(to top, var(--bg), transparent);
    }

    .hero-badge {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .hero-banner h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3.5rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 10px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }

    .hero-banner p {
      font-size: 1.15rem;
      max-width: 620px;
      opacity: 0.95;
      font-weight: 400;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    /* Filters & Controls */
    .filter-section {
      background: var(--surface);
      padding: 24px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 30px;
      border: 1px solid var(--border);
    }

    .search-and-sort {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 16px;
      margin-bottom: 20px;
    }

    .search-box input {
      width: 100%;
      padding: 12px 18px;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
      background: #faf8fc;
    }

    .search-box input:focus {
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(155, 114, 170, 0.12);
    }

    .select-box select {
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 0.9rem;
      font-family: inherit;
      font-weight: 600;
      color: var(--text);
      background: #faf8fc;
      outline: none;
      cursor: pointer;
      transition: all 0.2s ease;
      height: 100%;
    }

    .select-box select:focus {
      border-color: var(--primary);
      background: #fff;
    }

    .categories-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: thin;
      scrollbar-color: var(--primary) transparent;
    }

    .categories-scroll::-webkit-scrollbar {
      height: 6px;
    }

    .categories-scroll::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 10px;
    }

    .filter-btn {
      white-space: nowrap;
      padding: 10px 18px;
      border: 1px solid var(--border);
      border-radius: 30px;
      background: var(--bg);
      color: var(--text);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn:hover {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary-dark);
    }

    .filter-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(155, 114, 170, 0.3);
    }

    /* Quick Price Filter Bar */
    .price-quick-filters {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed var(--border);
      flex-wrap: wrap;
    }

    .price-label-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin-right: 6px;
    }

    .price-badge-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .price-badge-btn:hover, .price-badge-btn.active {
      background: var(--primary-light);
      color: var(--primary-dark);
      border-color: var(--primary);
    }

    /* Grid */
    .gift-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    /* Card */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      border: 1px solid rgba(238, 221, 242, 0.7);
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-hover);
    }

    .card.purchased {
      opacity: 0.75;
      background-color: #f9f9f9;
    }

    .card-img-container {
      position: relative;
      width: 100%;
      height: 220px;
      background-color: var(--primary-light);
      overflow: hidden;
    }

    .card-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .card:hover .card-img-container img {
      transform: scale(1.05);
    }

    .favorite-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(4px);
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }

    .favorite-btn:hover {
      transform: scale(1.1);
      background: #fff;
    }

    .card-body {
      padding: 18px 20px 12px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .brand {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
      line-height: 1.35;
    }

    .description {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 12px;
      flex-grow: 1;
    }

    .price {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin-top: auto;
    }

    .card-actions {
      padding: 12px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-buy {
      display: block;
      width: 100%;
      padding: 10px;
      background: var(--primary);
      color: #fff;
      text-align: center;
      text-decoration: none;
      font-weight: 600;
      border-radius: 10px;
      transition: background 0.2s ease;
      font-size: 0.9rem;
    }

    .btn-buy:hover {
      background: var(--primary-dark);
    }

    .btn-purchased {
      width: 100%;
      padding: 10px;
      background: transparent;
      border: 1.5px solid var(--border);
      color: var(--text-muted);
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    .btn-purchased:hover {
      background: #f0f0f0;
      color: var(--text);
    }

    .card.purchased .btn-purchased {
      background: #e8f5e9;
      color: #2e7d32;
      border-color: #a5d6a7;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 50px;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 768px) {
      .search-and-sort {
        grid-template-columns: 1fr;
      }
      .hero-banner {
        height: 260px;
      }
      .hero-banner h1 {
        font-size: 2.5rem;
      }
    }
  </style>
</head>

      if (items.length === 0) {

          <div style="grid-column: 1/-1; text-align: center; color: #777; padding: 50px 20px; background: #fff; border-radius: 16px; box-shadow: var(--shadow);">

          </div>`;
        return;
      }

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = `card ${item.purchased ? 'purchased' : ''}`;
        
        card.innerHTML = `
          <div class="card-img-container">
            <img src="${item.image}" alt="${item.title}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1513151233558-d860c5398176?w=500&q=80'">
            <button class="favorite-btn" onclick="toggleFavorite(this)">🤍</button>
          </div>
          <div class="card-body">
            <span class="brand">${item.brand}</span>
            <h3 class="title">${item.title}</h3>
            <p class="description">${item.desc}</p>
            <p class="price">${item.priceLabel}</p>
          </div>
          <div class="card-actions">
            <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="btn-buy">Comprar na Loja</a>
            <button class="btn-purchased" onclick="togglePurchased(${item.id}, this)">
              ${item.purchased ? '✓ Marcado como Comprado' : 'Já comprei este item'}
            </button>
          </div>
        `;
        giftGrid.appendChild(card);
      });
    }

    function toggleFavorite(btn) {
      btn.textContent = btn.textContent === '🤍' ? '❤️' : '🤍';
    }

    function togglePurchased(id, btn) {
      const item = gifts.find(g => g.id === id);
      if (item) {
        item.purchased = !item.purchased;
        renderGifts(filterAndSearch());
      }
    }

    function filterAndSearch() {
      const searchTerm = searchInput.value.toLowerCase();

      let filtered = gifts.filter(gift => {
        const matchesCategory = activeCategory === 'all' || gift.category === activeCategory;
        const matchesSearch = gift.title.toLowerCase().includes(searchTerm) || 
                              gift.brand.toLowerCase().includes(searchTerm);

        let matchesPrice = true;
        if (activePriceFilter === 'under-150') matchesPrice = gift.price <= 150;
        else if (activePriceFilter === '150-300') matchesPrice = gift.price > 150 && gift.price <= 300;
        else if (activePriceFilter === '300-600') matchesPrice = gift.price > 300 && gift.price <= 600;
        else if (activePriceFilter === 'above-600') matchesPrice = gift.price > 600;

        return matchesCategory && matchesSearch && matchesPrice;
      });

      // Ordenação de preços
      const sortValue = sortSelect.value;
      if (sortValue === 'price-asc') {
        filtered.sort((a, b) => a.price - b.price);
      } else if (sortValue === 'price-desc') {
        filtered.sort((a, b) => b.price - a.price);
      }

      return filtered;
    }

        filterBtns.forEach(b => b.classList.remove('active'));

        activeCategory = btn.dataset.category;
        renderGifts(filterAndSearch());
