    :root {

      --tiffany-dark: #3BA99F;
      --dourado: #D4AF37;
      --dourado-hover: #B59021;
      --fundo-soft: #FAF9FC;
      --texto-dark: #2C2C30;
      --texto-muted: #6E6D7A;
      --branco: #FFFFFF;
      --sombra-soft: 0 10px 30px rgba(139, 95, 158, 0.08);
      --sombra-hover: 0 15px 35px rgba(139, 95, 158, 0.15);
      --card-radius: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--fundo-soft);
      color: var(--texto-dark);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Header & Hero */
    .hero {
      position: relative;
      min-height: 55vh;
      background: linear-gradient(135deg, #CBB4D5 0%, #81D8D0 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--branco);
      padding: 60px 20px 80px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 800px;
    }

    .hero-content .subtitle {
      font-size: 0.85rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 12px;
      opacity: 0.95;
    }

    .hero-content h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(3rem, 8vw, 5.5rem);
      letter-spacing: 6px;
      color: #FFF;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.15);
      margin: 5px 0 15px;
      font-weight: 700;
    }

    .hero-content .date {
      font-size: 1.05rem;
      max-width: 620px;
      margin: 0 auto;
      font-weight: 300;
      line-height: 1.7;
    }

    /* Controls Section */
    .controls-section {
      max-width: 1240px;
      margin: -40px auto 35px;
      padding: 0 20px;
      position: relative;
      z-index: 10;
    }

    .search-and-sort {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 280px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 16px 25px;
      border-radius: 50px;
      border: 1px solid rgba(212, 175, 55, 0.4);
      background: var(--branco);
      font-size: 0.95rem;
      box-shadow: var(--sombra-soft);
      outline: none;
      transition: all 0.3s ease;
      color: var(--texto-dark);
    }

    .search-box input:focus {
      border-color: var(--lavanda-escuro);
      box-shadow: 0 0 0 4px rgba(139, 95, 158, 0.15);
    }

    .sort-select {
      padding: 0 25px;
      border-radius: 50px;
      border: 1px solid rgba(212, 175, 55, 0.4);
      background: var(--branco);
      font-size: 0.9rem;
      color: var(--texto-dark);
      box-shadow: var(--sombra-soft);
      outline: none;
      cursor: pointer;
      font-family: inherit;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .sort-select:focus {
      border-color: var(--lavanda-escuro);
    }

    .category-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      padding: 10px 0;
    }

    .filter-btn {
      background: var(--branco);
      border: 1px solid var(--lavanda-escuro);
      color: var(--lavanda-escuro);
      padding: 10px 20px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--lavanda-escuro);
      color: var(--branco);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(139, 95, 158, 0.25);
    }

    /* Grid Layout */
    .grid-container {
      max-width: 1240px;
      margin: 0 auto 60px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 30px;
      padding: 0 20px;
    }

    /* Card Component */
    .card {
      background: var(--branco);
      border-radius: var(--card-radius);
      overflow: hidden;
      box-shadow: var(--sombra-soft);
      transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
      display: flex;
      flex-direction: column;
      position: relative;
      border: 1px solid rgba(230, 230, 250, 0.8);
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: var(--sombra-hover);
    }

    .card-img-container {
      height: 240px;
      overflow: hidden;
      position: relative;
      background: #F8F6FA;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .card:hover .card-img-container img {
      transform: scale(1.05);
    }

    .favorite-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(4px);
      border: none;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.2s;
      z-index: 2;
    }

    .favorite-btn:hover {
      transform: scale(1.15);
    }

    .card-body {
      padding: 22px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .brand {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--tiffany-dark);
      font-weight: 700;
      letter-spacing: 1.2px;
      margin-bottom: 6px;
    }

    .title {
      font-family: 'Cinzel', serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--texto-dark);
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .description {
      font-size: 0.85rem;
      color: var(--texto-muted);
      margin-bottom: 18px;
      flex-grow: 1;
    }

    .price {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--dourado-hover);
      margin-top: auto;
    }

    .card-actions {
      padding: 0 22px 22px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-buy {
      background: var(--dourado);
      color: var(--branco);
      text-decoration: none;
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background 0.3s;
      box-shadow: 0 4px 10px rgba(214, 175, 55, 0.2);
    }

    .btn-buy:hover {
      background: var(--dourado-hover);
    }

    .btn-purchased {
      background: transparent;
      border: 1px solid #D0D0D0;
      color: #777;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.3s;
    }

    .btn-purchased:hover {
      background: #F0F0F0;
      color: #333;
    }

    .card.purchased {
      opacity: 0.65;
      filter: grayscale(40%);
    }

    .card.purchased .btn-buy {
      pointer-events: none;
      background: #BBB;
      box-shadow: none;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 45px 20px;
      background: var(--lavanda);
      color: var(--texto-dark);
      font-size: 0.95rem;
      font-weight: 500;

      height: 100%;

      align-items: center;
      justify-content: center;
      background: linear-gradient(45deg, #F3EEF8, #E6E6FA);

      }

        font-size: 0.8rem;
      }

    // Elementos DOM
    const giftGrid = document.getElementById('giftGrid');
    const searchInput = document.getElementById('searchInput');
    const sortSelect = document.getElementById('sortSelect');
    const filterBtns = document.querySelectorAll('.filter-btn');

    let activeCategory = 'all';

    // Gerador de imagem de reserva (Placeholder elegante com iniciais/título)
    function handleImgError(imgElement, title) {
      const parent = imgElement.parentElement;
      parent.innerHTML = `
        <div class="img-placeholder">
          <span>${title}</span>
        </div>
        <button class="favorite-btn" onclick="toggleFavorite(this)">🤍</button>
      `;
    }

    // Renderizar os presentes na página
    function renderGifts(items) {
      giftGrid.innerHTML = '';

      if (items.length === 0) {
        giftGrid.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px;">
            <p style="font-size: 1.1rem; color: #777; font-family: 'Cinzel', serif;">Nenhum presente encontrado para esta busca.</p>
          </div>
        `;
        return;
      }

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = `card ${item.purchased ? 'purchased' : ''}`;
        
        card.innerHTML = `
          <div class="card-img-container">
            <img src="${item.image}" alt="${item.title}" onerror="handleImgError(this, '${item.title.replace(/'/g, "\\'")}')">
            <button class="favorite-btn" onclick="toggleFavorite(this, event)">🤍</button>
          </div>
          <div class="card-body">
            <span class="brand">${item.brand}</span>
            <h3 class="title">${item.title}</h3>
            <p class="description">${item.desc}</p>
            <p class="price">${item.priceLabel}</p>
          </div>
          <div class="card-actions">
            <a href="${item.link}" target="_blank" class="btn-buy" rel="noopener noreferrer">Comprar na Loja</a>
            <button class="btn-purchased" onclick="togglePurchased(${item.id})">
              ${item.purchased ? '✓ Marcado como Comprado' : 'Já comprei este item'}
            </button>
          </div>
        `;
        giftGrid.appendChild(card);
      });
    }

    // Alternar status de Favorito
    function toggleFavorite(btn, event) {
      if(event) event.stopPropagation();
      btn.textContent = btn.textContent === '🤍' ? '❤️' : '🤍';
    }

    // Alternar status de Já Comprado
    function togglePurchased(id) {
      const item = gifts.find(g => g.id === id);
      if (item) {
        item.purchased = !item.purchased;
        renderGifts(filterAndSearch());
      }
    }

    // Filtragem, busca e ordenação
    function filterAndSearch() {
      const searchTerm = searchInput.value.toLowerCase().trim();
      const sortOrder = sortSelect.value;

      let filtered = gifts.filter(gift => {
        const matchesCategory = activeCategory === 'all' || gift.category === activeCategory;
        const matchesSearch = gift.title.toLowerCase().includes(searchTerm) || 
                              gift.brand.toLowerCase().includes(searchTerm);

        return matchesCategory && matchesSearch;
      });

      if (sortOrder === 'price-asc') {
        filtered.sort((a, b) => a.price - b.price);
      } else if (sortOrder === 'price-desc') {
        filtered.sort((a, b) => b.price - a.price);
      }

      return filtered;
    }

    // Listeners dos Filtros
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCategory = btn.dataset.category;
        renderGifts(filterAndSearch());
      });
    });

    searchInput.addEventListener('input', () => {
      renderGifts(filterAndSearch());
    });

    sortSelect.addEventListener('change', () => {
      renderGifts(filterAndSearch());
    });

    // Renderização Inicial
    renderGifts(gifts);
  </script>
